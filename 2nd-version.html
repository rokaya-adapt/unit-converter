<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📏 Teacher-Approved Unit Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 48px;
            padding: 45px 40px;
            box-shadow: 0 30px 50px -20px #1e293b99;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .badge {
            background: #e6f0ff;
            color: #1d4ed8;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .selector {
            margin-bottom: 30px;
        }

        select {
            width: 100%;
            padding: 18px 24px;
            border-radius: 40px;
            border: 2px solid #e2e8f0;
            font-size: 1.1rem;
            background: blue;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23334155%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 20px;
        }

        select:focus {
            border-color: #2563eb;
            outline: none;
        }

        .converter-box {
            background: green;
            border-radius: 40px;
            padding: 30px 25px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 18px 22px;
            border-radius: 30px;
            border: 2px solid #cbd5e1;
            font-size: 1.2rem;
            background: white;
            transition: 0.15s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px #2563eb20;
        }

        .input-group input[readonly] {
            background: #e9ecf2;
            color: #1e293b;
            font-weight: 500;
        }

        /* NEW: Favorite button */
        .favorite-input-btn {
            background: white;
            border: 2px solid #ffd700;
            color: #ffb347;
            font-size: 1.3rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .favorite-input-btn.active {
            background: #ffd700;
            color: white;
        }

        .favorite-input-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #ffd700;
        }

        .swap-icon {
            text-align: center;
            font-size: 1.8rem;
            color: #475569;
            margin: 5px 0;
            font-weight: 300;
        }

        .formula-hint {
            text-align: center;
            font-size: 0.9rem;
            color: lime;
            margin-top: 10px;
            padding: 8px;
            background: white;
            border-radius: 40px;
        }

        /* NEW: Favorites section */
        .favorites-section {
            margin-top: 30px;
            background: #f8fafc;
            border-radius: 40px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h3 {
            color: #1e3c72;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .favorite-item {
            background: white;
            border-radius: 30px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 5px solid #ffd700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .favorite-item:hover {
            background: #f1f5f9;
            transform: translateX(5px);
        }

        .favorite-item-content {
            flex: 1;
        }

        .favorite-item-title {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .favorite-item-details {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .favorite-item-type {
            background: #e6f0ff;
            padding: 2px 8px;
            border-radius: 40px;
            color: #1d4ed8;
        }

        .favorite-item-actions {
            display: flex;
            gap: 8px;
        }

        .favorite-item-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .favorite-item-btn:hover {
            background: #e2e8f0;
        }

        .favorite-item-btn.delete:hover {
            color: #ef4444;
        }

        /* NEW: History section */
        .history-section {
            margin-top: 20px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .history-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-item:hover {
            background: #f1f5f9;
            border-color: #2563eb;
        }

        .history-item-type {
            background: #e6f0ff;
            padding: 2px 6px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #1d4ed8;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #62748c;
            text-align: center;
            border-top: 1px dashed #cbd5e1;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📐 Unit Converter</h1>
        <div class="badge">✓ Teacher approved · No ads</div>

        <div class="selector">
            <select id="conversionType">
                <option value="length">Length (meters ⇄ feet)</option>
                <option value="volume">Volume (liters ⇄ gallons)</option>
                <option value="mass">Mass (kilograms ⇄ pounds)</option>
                <option value="temperature">Temperature (°C ⇄ °F)</option>
            </select>
        </div>

        <div class="converter-box">
            <div class="input-group">
                <label id="fromLabel">From (meters):</label>
                <div class="input-wrapper">
                    <input type="number" id="fromValue" placeholder="0" step="any" value="1">
                    <!-- NEW: Favorite button for from value -->
                    <button class="favorite-input-btn" id="favoriteFromBtn" title="Save this conversion">☆</button>
                </div>
            </div>

            <div class="swap-icon">⇅</div>

            <div class="input-group">
                <label id="toLabel">To (feet):</label>
                <div class="input-wrapper">
                    <input type="number" id="toValue" placeholder="0" step="any" readonly>
                    <!-- NEW: Favorite button for to value -->
                    <button class="favorite-input-btn" id="favoriteToBtn" title="Save this conversion">☆</button>
                </div>
            </div>

            <div class="formula-hint" id="formulaHint">1 m = 3.28084 ft</div>
        </div>

        <!-- NEW: Favorites Section -->
        <div class="favorites-section">
            <div class="section-header">
                <h3>⭐ Favorite Conversions</h3>
                <button class="favorite-item-btn" id="clearFavoritesBtn" title="Clear all favorites">🗑️</button>
            </div>
            <div id="favoritesList" class="favorites-list">
                <!-- Favorites will be displayed here -->
            </div>
        </div>

        <!-- NEW: History Section -->
        <div class="history-section">
            <h3 style="color: #1e3c72; font-size: 1rem;">📜 Recent Conversions</h3>
            <div id="historyList" class="history-list">
                <!-- History will be displayed here -->
            </div>
        </div>

        <div class="footer-note">
            ⚡ Updates instantly · Type any number · Click ☆ to save favorites
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const typeSelect = document.getElementById('conversionType');
            const fromInput = document.getElementById('fromValue');
            const toInput = document.getElementById('toValue');
            const fromLabel = document.getElementById('fromLabel');
            const toLabel = document.getElementById('toLabel');
            const formulaHint = document.getElementById('formulaHint');
            
            // NEW: Favorites and history DOM elements
            const favoriteFromBtn = document.getElementById('favoriteFromBtn');
            const favoriteToBtn = document.getElementById('favoriteToBtn');
            const favoritesList = document.getElementById('favoritesList');
            const historyList = document.getElementById('historyList');
            const clearFavoritesBtn = document.getElementById('clearFavoritesBtn');

            // ===========================================
            // NEW FEATURE: Conversion History & Favorites
            // ===========================================

            // State
            let favorites = JSON.parse(localStorage.getItem('converterFavorites')) || [];
            let history = JSON.parse(localStorage.getItem('converterHistory')) || [];
            const MAX_HISTORY = 5;

            // Conversion definitions
            const converters = {
                length: {
                    name: 'Length',
                    fromLabel: 'From (meters):',
                    toLabel: 'To (feet):',
                    convert: (m) => m * 3.28084,
                    reverse: (ft) => ft / 3.28084,
                    formula: '1 m = 3.28084 ft',
                    fromUnit: 'm',
                    toUnit: 'ft'
                },
                volume: {
                    name: 'Volume',
                    fromLabel: 'From (liters):',
                    toLabel: 'To (gallons):',
                    convert: (l) => l * 0.264172,
                    reverse: (gal) => gal / 0.264172,
                    formula: '1 L = 0.264172 gal',
                    fromUnit: 'L',
                    toUnit: 'gal'
                },
                mass: {
                    name: 'Mass',
                    fromLabel: 'From (kilograms):',
                    toLabel: 'To (pounds):',
                    convert: (kg) => kg * 2.20462,
                    reverse: (lb) => lb / 2.20462,
                    formula: '1 kg = 2.20462 lb',
                    fromUnit: 'kg',
                    toUnit: 'lb'
                },
                temperature: {
                    name: 'Temperature',
                    fromLabel: 'From (°C):',
                    toLabel: 'To (°F):',
                    convert: (c) => (c * 9/5) + 32,
                    reverse: (f) => (f - 32) * 5/9,
                    formula: '°F = (°C × 9/5) + 32',
                    fromUnit: '°C',
                    toUnit: '°F'
                }
            };

            // Save to localStorage
            function saveFavorites() {
                localStorage.setItem('converterFavorites', JSON.stringify(favorites));
                updateFavoritesDisplay();
                updateFavoriteButtonsState();
            }

            function saveHistory() {
                localStorage.setItem('converterHistory', JSON.stringify(history));
                updateHistoryDisplay();
            }

            // Get current conversion data
            function getCurrentConversion() {
                const type = typeSelect.value;
                const conv = converters[type];
                const fromVal = parseFloat(fromInput.value) || 0;
                const toVal = parseFloat(toInput.value) || 0;
                
                return {
                    type: type,
                    typeName: conv.name,
                    fromValue: fromVal,
                    toValue: toVal,
                    fromUnit: conv.fromUnit,
                    toUnit: conv.toUnit,
                    fromLabel: conv.fromLabel.replace('From (', '').replace('):', ''),
                    toLabel: conv.toLabel.replace('To (', '').replace('):', ''),
                    timestamp: new Date().toLocaleString()
                };
            }

            // Add to history
            function addToHistory() {
                const conversion = getCurrentConversion();
                
                // Don't add if both values are 0
                if (conversion.fromValue === 0 && conversion.toValue === 0) return;
                
                // Create history string
                const historyItem = {
                    id: Date.now(),
                    type: conversion.type,
                    typeName: conversion.typeName,
                    fromValue: conversion.fromValue.toFixed(2),
                    toValue: conversion.toValue.toFixed(2),
                    fromUnit: conversion.fromUnit,
                    toUnit: conversion.toUnit,
                    display: `${conversion.fromValue.toFixed(2)} ${conversion.fromUnit} → ${conversion.toValue.toFixed(2)} ${conversion.toUnit}`,
                    timestamp: conversion.timestamp
                };
                
                // Remove if already exists (by id)
                history = history.filter(item => item.display !== historyItem.display);
                
                // Add to beginning
                history.unshift(historyItem);
                
                // Keep only last MAX_HISTORY items
                if (history.length > MAX_HISTORY) {
                    history = history.slice(0, MAX_HISTORY);
                }
                
                saveHistory();
            }

            // Toggle favorite
            function toggleFavorite() {
                const conversion = getCurrentConversion();
                
                // Don't save if both values are 0
                if (conversion.fromValue === 0 && conversion.toValue === 0) {
                    alert('Enter a value to save to favorites');
                    return;
                }
                
                // Create favorite string for comparison
                const favoriteString = `${conversion.type}|${conversion.fromValue.toFixed(4)}|${conversion.toValue.toFixed(4)}`;
                
                const index = favorites.findIndex(fav => 
                    fav.type === conversion.type && 
                    Math.abs(fav.fromValue - conversion.fromValue) < 0.0001 &&
                    Math.abs(fav.toValue - conversion.toValue) < 0.0001
                );
                
                if (index === -1) {
                    // Add to favorites
                    favorites.push({
                        ...conversion,
                        fromValue: conversion.fromValue,
                        toValue: conversion.toValue,
                        id: Date.now()
                    });
                } else {
                    // Remove from favorites
                    favorites.splice(index, 1);
                }
                
                saveFavorites();
            }

            // Check if current conversion is favorite
            function isCurrentConversionFavorite() {
                const conversion = getCurrentConversion();
                
                return favorites.some(fav => 
                    fav.type === conversion.type && 
                    Math.abs(fav.fromValue - conversion.fromValue) < 0.0001 &&
                    Math.abs(fav.toValue - conversion.toValue) < 0.0001
                );
            }

            // Update favorite buttons state
            function updateFavoriteButtonsState() {
                const isFavorite = isCurrentConversionFavorite();
                
                [favoriteFromBtn, favoriteToBtn].forEach(btn => {
                    if (isFavorite) {
                        btn.classList.add('active');
                        btn.innerHTML = '⭐';
                    } else {
                        btn.classList.remove('active');
                        btn.innerHTML = '☆';
                    }
                });
            }

            // Update favorites display
            function updateFavoritesDisplay() {
                if (favorites.length === 0) {
                    favoritesList.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 15px;">No favorite conversions yet. Click ☆ to save!</div>';
                    return;
                }
                
                favoritesList.innerHTML = favorites.map((fav, index) => `
                    <div class="favorite-item" onclick="window.loadConversion(${index})">
                        <div class="favorite-item-content">
                            <div class="favorite-item-title">${fav.fromValue.toFixed(2)} ${fav.fromUnit} → ${fav.toValue.toFixed(2)} ${fav.toUnit}</div>
                            <div class="favorite-item-details">
                                <span class="favorite-item-type">${fav.typeName}</span>
                                <span>${fav.timestamp}</span>
                            </div>
                        </div>
                        <div class="favorite-item-actions">
                            <button class="favorite-item-btn delete" onclick="window.removeFavorite(${index}, event)">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            // Update history display
            function updateHistoryDisplay() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div style="color: #94a3b8;">No recent conversions</div>';
                    return;
                }
                
                historyList.innerHTML = history.map(item => `
                    <div class="history-item" onclick="window.loadHistoryItem('${item.id}')">
                        <span>${item.fromValue} ${item.fromUnit} → ${item.toValue} ${item.toUnit}</span>
                        <span class="history-item-type">${item.typeName}</span>
                    </div>
                `).join('');
            }

            // Load a favorite conversion
            window.loadConversion = function(index) {
                const fav = favorites[index];
                if (fav) {
                    typeSelect.value = fav.type;
                    updateUI();
                    fromInput.value = fav.fromValue;
                    convertFrom();
                }
            };

            // Load a history item
            window.loadHistoryItem = function(id) {
                const item = history.find(h => h.id == id);
                if (item) {
                    typeSelect.value = item.type;
                    updateUI();
                    fromInput.value = item.fromValue;
                    convertFrom();
                }
            };

            // Remove favorite
            window.removeFavorite = function(index, event) {
                event.stopPropagation();
                favorites.splice(index, 1);
                saveFavorites();
                updateFavoriteButtonsState();
            };

            // Clear all favorites
            function clearAllFavorites() {
                if (confirm('Clear all favorite conversions?')) {
                    favorites = [];
                    saveFavorites();
                }
            }

            // Update labels and hint based on selected type
            function updateUI() {
                const type = typeSelect.value;
                const conv = converters[type];
                
                fromLabel.textContent = conv.fromLabel;
                toLabel.textContent = conv.toLabel;
                formulaHint.textContent = conv.formula;
            }

            // Convert from left (fromValue) to right (toValue)
            function convertFrom() {
                const type = typeSelect.value;
                const conv = converters[type];
                const val = parseFloat(fromInput.value);
                
                if (!isNaN(val)) {
                    toInput.value = conv.convert(val).toFixed(4);
                    // Add to history
                    addToHistory();
                } else {
                    toInput.value = '';
                }
                
                // Update favorite buttons
                updateFavoriteButtonsState();
            }

            // Convert from right (toValue) to left (fromValue)
            function convertTo() {
                const type = typeSelect.value;
                const conv = converters[type];
                const val = parseFloat(toInput.value);
                
                if (!isNaN(val)) {
                    fromInput.value = conv.reverse(val).toFixed(4);
                    // Add to history
                    addToHistory();
                } else {
                    fromInput.value = '';
                }
                
                // Update favorite buttons
                updateFavoriteButtonsState();
            }

            // Event listeners
            typeSelect.addEventListener('change', () => {
                updateUI();
                convertFrom(); // Recalculate with new unit
            });

            fromInput.addEventListener('input', convertFrom);
            
            // Allow editing the right field too (for reverse conversion)
            toInput.removeAttribute('readonly');
            toInput.addEventListener('input', convertTo);

            // NEW: Favorite button listeners
            favoriteFromBtn.addEventListener('click', toggleFavorite);
            favoriteToBtn.addEventListener('click', toggleFavorite);

            // NEW: Clear favorites button
            clearFavoritesBtn.addEventListener('click', clearAllFavorites);

            // Initialize
            updateUI();
            fromInput.value = '1';
            convertFrom();
            
            // Initialize displays
            updateFavoritesDisplay();
            updateHistoryDisplay();
        })();
    </script>
</body>
</html>
